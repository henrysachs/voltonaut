# Voltonaut API behind the existing Financensor Traefik (ADR-004, ADR-009).
# The Financensor Traefik owns ports 80/443; this project only joins its network.

name: voltonaut

services:
  server:
    image: ${VOLTONAUT_IMAGE:-voltonaut-server}:${VOLTONAUT_TAG:?explicit release tag required}
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      NODE_ENV: production
      DATABASE_PATH: /app/data/voltonaut.db
      AUTH_MODE: ${AUTH_MODE:?explicit auth mode required}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:?canonical client origin required}
      CORS_ORIGINS: ${CLIENT_ORIGIN:?canonical client origin required}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-cloudflare}
      CLOUDFLARE_EMAIL_API_TOKEN: ${CLOUDFLARE_EMAIL_API_TOKEN:-}
      CLOUDFLARE_EMAIL_ACCOUNT_ID: ${CLOUDFLARE_EMAIL_ACCOUNT_ID:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    volumes:
      - sqlite:/app/data
    networks:
      - traefik
    labels:
      - traefik.enable=true
      - traefik.http.routers.voltonaut-server.rule=Host(`api.voltonaut.stammkneipe.dev`)
      - traefik.http.routers.voltonaut-server.entrypoints=websecure
      - traefik.http.routers.voltonaut-server.tls.certresolver=letsencrypt
      - traefik.http.services.voltonaut-server.loadbalancer.server.port=3000
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then((r) => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  litestream:
    image: litestream/litestream:0.5.18
    restart: unless-stopped
    user: "1000:1000"
    command: ["replicate", "-config", "/etc/litestream/litestream.yml"]
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - sqlite:/data
      - ./litestream.yml:/etc/litestream/litestream.yml:ro
    environment:
      LITESTREAM_BUCKET: ${LITESTREAM_BUCKET:?external backup bucket required}
      LITESTREAM_ENDPOINT: ${LITESTREAM_ENDPOINT:?external backup endpoint required}
      LITESTREAM_ACCESS_KEY_ID: ${LITESTREAM_ACCESS_KEY_ID:?external backup access key required}
      LITESTREAM_SECRET_ACCESS_KEY: ${LITESTREAM_SECRET_ACCESS_KEY:?external backup secret required}
    healthcheck:
      test:
        [
          "CMD",
          "litestream",
          "sync",
          "-wait",
          "-timeout",
          "10",
          "-socket",
          "/tmp/voltonaut-litestream.sock",
          "/data/voltonaut.db",
        ]
      interval: 10s
      timeout: 15s
      retries: 3
      start_period: 10s

volumes:
  sqlite:

networks:
  traefik:
    name: financensor_default
    external: true
