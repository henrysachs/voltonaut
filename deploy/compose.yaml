# Voltonaut API behind the existing Financensor Traefik (ADR-004, ADR-009).
# The Financensor Traefik owns ports 80/443; this project only joins its network.

name: voltonaut

services:
  server:
    image: ${VOLTONAUT_IMAGE:-voltonaut-server}:${VOLTONAUT_TAG:?explicit release tag required}
    restart: unless-stopped
    env_file:
      - path: ./strava.env
        required: false
      - path: ./strava-webhook.env
        required: false
    environment:
      HOST: 0.0.0.0
      NODE_ENV: production
      DATABASE_PATH: /app/data/voltonaut.db
      AUTH_MODE: ${AUTH_MODE:?explicit auth mode required}
      AUTH_TOMBSTONE_HMAC_KEY: ${AUTH_TOMBSTONE_HMAC_KEY:?32-byte tombstone HMAC key required}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:?canonical client origin required}
      CORS_ORIGINS: ${CLIENT_ORIGIN:?canonical client origin required}
      OIDC_PROVIDERS: ${OIDC_PROVIDERS:-}
      OIDC_CLOUDFLARE_DISPLAY_NAME: ${OIDC_CLOUDFLARE_DISPLAY_NAME:-}
      OIDC_CLOUDFLARE_ISSUER: ${OIDC_CLOUDFLARE_ISSUER:-}
      OIDC_CLOUDFLARE_CLIENT_ID: ${OIDC_CLOUDFLARE_CLIENT_ID:-}
      OIDC_CLOUDFLARE_CLIENT_SECRET: ${OIDC_CLOUDFLARE_CLIENT_SECRET:-}
      OIDC_CLOUDFLARE_REDIRECT_URI: ${OIDC_CLOUDFLARE_REDIRECT_URI:-}
      OIDC_CLOUDFLARE_SCOPES: ${OIDC_CLOUDFLARE_SCOPES:-}
      OIDC_CLOUDFLARE_REQUIRE_EMAIL_VERIFIED: ${OIDC_CLOUDFLARE_REQUIRE_EMAIL_VERIFIED:-}
      OIDC_CLOUDFLARE_ID_TOKEN_ALG: ${OIDC_CLOUDFLARE_ID_TOKEN_ALG:-}
      OIDC_AUTHENTIK_DISPLAY_NAME: ${OIDC_AUTHENTIK_DISPLAY_NAME:-}
      OIDC_AUTHENTIK_ISSUER: ${OIDC_AUTHENTIK_ISSUER:-}
      OIDC_AUTHENTIK_CLIENT_ID: ${OIDC_AUTHENTIK_CLIENT_ID:-}
      OIDC_AUTHENTIK_CLIENT_SECRET: ${OIDC_AUTHENTIK_CLIENT_SECRET:-}
      OIDC_AUTHENTIK_REDIRECT_URI: ${OIDC_AUTHENTIK_REDIRECT_URI:-}
      OIDC_AUTHENTIK_SCOPES: ${OIDC_AUTHENTIK_SCOPES:-}
      OIDC_AUTHENTIK_REQUIRE_EMAIL_VERIFIED: ${OIDC_AUTHENTIK_REQUIRE_EMAIL_VERIFIED:-}
      OIDC_AUTHENTIK_ID_TOKEN_ALG: ${OIDC_AUTHENTIK_ID_TOKEN_ALG:-}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-cloudflare}
      CLOUDFLARE_EMAIL_API_TOKEN: ${CLOUDFLARE_EMAIL_API_TOKEN:-}
      CLOUDFLARE_EMAIL_ACCOUNT_ID: ${CLOUDFLARE_EMAIL_ACCOUNT_ID:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    volumes:
      - sqlite:/app/data
    networks:
      - traefik
    labels:
      - traefik.enable=true
      - traefik.http.routers.voltonaut-server.rule=Host(`api.voltonaut.stammkneipe.dev`)
      - traefik.http.routers.voltonaut-server.entrypoints=websecure
      - traefik.http.routers.voltonaut-server.tls.certresolver=letsencrypt
      - traefik.http.services.voltonaut-server.loadbalancer.server.port=3000
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then((r) => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

volumes:
  sqlite:

networks:
  traefik:
    name: financensor_default
    external: true
