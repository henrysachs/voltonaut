name: mutation

on:
  pull_request:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

jobs:
  paths:
    name: mutation-scope-changed
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.filter.outputs.core }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      # No workflow-level path filter: the required `mutation` context must report on every PR.
      # Off-scope PRs skip the job, which GitHub counts as passing (ADR-036).
      # `shell: bash` adds pipefail; the separate assignment makes a failing `git diff` fail the step
      # instead of reading as "no scope change" and skipping the job (ADR-036).
      - name: Detect changes in the mutation scope
        id: filter
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "core=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="origin/${{ github.event.pull_request.base.ref }}"
          scope='^(packages/(engine|rules)/|packages/ble/src/ftms/|apps/server/src/strava/|stryker\.config\.json$)'
          files=$(git diff --name-only "${base}...HEAD")
          if printf '%s\n' "$files" | grep -Eq "$scope"; then
            echo "core=true" >> "$GITHUB_OUTPUT"
          else
            echo "core=false" >> "$GITHUB_OUTPUT"
          fi

  mutation:
    name: mutation
    needs: paths
    # A skipped job counts as passing, so a failed scope detection must not skip this job.
    if: ${{ !cancelled() && (needs.paths.result != 'success' || needs.paths.outputs.core == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail when scope detection failed
        if: needs.paths.result != 'success'
        run: exit 1

      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Install pinned tools
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5

      - name: Install dependencies
        run: mise run install

      - name: Run mutation tests
        run: mise run check:mutation
